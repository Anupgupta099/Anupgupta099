name: Developer Log Update

on:
  schedule:
    - cron: "30 15 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update developer log
        run: |
          mkdir -p developer-log

          echo "" >> developer-log/progress.md
          echo "## $(date -u '+%Y-%m-%d')" >> developer-log/progress.md
          echo "- Scheduled development log update" >> developer-log/progress.md
          echo "- Continuing work on projects and learning" >> developer-log/progress.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add developer-log/progress.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update developer log"
            git push
          fi
